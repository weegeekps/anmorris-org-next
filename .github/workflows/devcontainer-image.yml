name: Dev Container Image

on:
  workflow_dispatch:
  push:
    paths:
      - '.devcontainer/**'
    branches: ['**']

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pre-build dev container image
        uses: devcontainers/ci@v0.3
        with:
          imageName: ghcr.io/${{ github.repository_owner }}/anmorris-org-next-devcontainer
          cacheFrom: ghcr.io/${{ github.repository_owner }}/anmorris-org-next-devcontainer
          push: always
