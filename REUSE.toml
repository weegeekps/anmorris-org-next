version = 1

# License for configuration files that can't have comments.
# Since configuration files are "functional", the are appropriately covered
# under the GPL-3.0-only license.
# Reference: https://guides.lib.utexas.edu/copyright/licenses
[[annotations]]
path = [".nvmrc", ".htmlhintrc", "**/*.json", "pnpm-lock.yaml", "static/manifest.webmanifest"]
SPDX-FileCopyrightText = "2026 Adam N. Morris"
SPDX-License-Identifier = "GPL-3.0-only"

# All fonts are OFL 1.1 licensed.
[[annotations]]
path = ["static/fonts/Jost-*.otf"]
SPDX-FileCopyrightText = "Copyright 2007 indestructible type* (https://indestructibletype.com/Jost.html)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ["static/fonts/SourceSans3VF-*.ttf"]
SPDX-FileCopyrightText = "Copyright 2010-2024 Adobe (https://github.com/adobe-fonts/source-sans)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ["static/fonts/FiraCode-*.ttf"]
SPDX-FileCopyrightText = "Copyright 2014-2020 The Fira Code Project Authors (https://github.com/tonsky/FiraCode)"
SPDX-License-Identifier = "OFL-1.1"

# The logo has more restrictions
[[annotations]]
path = [
    "static/anm-logo.png",
    "static/apple-touch-icon.png",
    "static/favicon.ico",
    "static/icon-192.png",
    "static/icon-512.png",
    "static/icon-mask.png"
]
SPDX-FileCopyrightText = "2026 Adam N. Morris"
SPDX-License-Identifier = "CC-BY-ND-4.0"
